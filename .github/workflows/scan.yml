name: 盘中扫描

# 北京时间 11:31 / 15:01 / 23:01 = UTC 03:31 / 07:01 / 15:01（中国无夏令时）
# 冗余备份档（2026-10-28）：每时段主档 +20 分钟再排一档，主档被调度器静默丢弃时由备份档补上；
# monitor.mjs 内 state.runs[日期:时段] 幂等守卫保证两档只实跑一次（后一档跳过但不影响 last_scan_slot）。
on:
  schedule:
    - cron: '31 3 * * *'    # 11:31 上午收盘后
    - cron: '51 3 * * *'    # 11:51 备份
    - cron: '1 7 * * *'     # 15:01 日盘收盘后
    - cron: '21 7 * * *'    # 15:21 备份
    - cron: '1 15 * * *'    # 23:01 夜盘收盘后
    - cron: '21 15 * * *'   # 23:21 备份
  workflow_dispatch:
    inputs:
      slot:
        description: '扫描时段 noon/evening/night'
        required: true
        default: 'noon'
        type: choice
        options: [noon, evening, night]

concurrency: qls-scan
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确定扫描时段（按时间窗口判定，容忍任务延迟漂移）
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.slot }}"
          else
            T=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
            # 计划时刻(UTC分钟)：noon=211(03:31), evening=421(07:01), night=901(15:01)
            # 取相邻计划时刻中点为窗口边界，延迟落入哪段就按哪段处理
            if [ $T -ge 316 ] && [ $T -lt 661 ]; then
              S=evening
            elif [ $T -ge 661 ] && [ $T -lt 1276 ]; then
              S=night
            else
              S=noon
            fi
          fi
          echo "slot=$S" >> "$GITHUB_OUTPUT"

      - name: 运行扫描引擎
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: node monitor.mjs scan ${{ steps.slot.outputs.slot }}

      - name: 提交数据与面板
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data config docs
          git diff --cached --quiet || git commit -m "scan ${{ steps.slot.outputs.slot }} $(date -u +'%F %T')"
          git push
