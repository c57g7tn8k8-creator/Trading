name: 月度维护

# 每月1日 10:00 北京时间 = UTC 02:00：品种池月度筛选 + 合约换月校准 + 面板重建
# 冗余三档（2026-10-28）：10:00 / 10:30 / 11:00；monitor.mjs 内 state.last_maintenance
# 幂等守卫保证同一月份只实跑一次（12月换月那次尤其关键，被丢会直接影响合约切换）。
on:
  schedule:
    - cron: '0 2 1 * *'
    - cron: '30 2 1 * *'
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 品种池月度筛选 + 合约换月维护
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          node monitor.mjs pool
          node monitor.mjs contracts
          node monitor.mjs nav

      - name: 提交变更
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add config data docs
          git diff --cached --quiet || git commit -m "maintenance $(date -u +'%F')"
          git push
