name: 信号提醒推送

# 北京时间 11:45 / 20:00 / 次日08:00 = UTC 03:45 / 12:00 / 00:00
# （较原 12:00/20:30/08:30 提前，抵消 GitHub 定时任务 5~20 分钟延迟；
#   引擎内含防竞态等待：若扫描尚未完成会先轮询等待，不会漏推信号）
# 冗余备份档（2026-10-28）：每档 +20 分钟再排一档（08:20 / 12:05 / 20:20），
# 时段由运行时刻所在时间窗自动判定（见下方 slot 步骤），延迟漂移也不会错位；
# monitor.mjs 内 state.last_remind 幂等守卫保证同一时段只推一次，不会重复发信号卡。
on:
  schedule:
    - cron: '45 3 * * *'    # 11:45 推送 11:31 时段信号
    - cron: '5 4 * * *'     # 12:05 备份
    - cron: '0 12 * * *'    # 20:00 推送 15:01 时段信号
    - cron: '20 12 * * *'   # 20:20 备份
    - cron: '0 0 * * *'     # 08:00 推送前一交易日 23:01 时段信号
    - cron: '20 0 * * *'    # 08:20 备份
  workflow_dispatch:
    inputs:
      slot:
        description: '提醒时段 noon/evening/morning'
        required: true
        default: 'noon'
        type: choice
        options: [noon, evening, morning]

concurrency: qls-remind
permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确定提醒时段（cron 精确映射 + 超时丢弃；2026-10-29）
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.slot }}"
          else
            # github.event.schedule = 触发本次运行的 cron 表达式，直接映射时段
            C="${{ github.event.schedule }}"
            IM=-1
            case "$C" in
              "45 3 * * *")  S=noon;    IM=225 ;;
              "5 4 * * *")   S=noon;    IM=245 ;;
              "0 12 * * *")  S=evening; IM=720 ;;
              "20 12 * * *") S=evening; IM=740 ;;
              "0 0 * * *")   S=morning; IM=0 ;;
              "20 0 * * *")  S=morning; IM=20 ;;
            esac
            if [ -n "$S" ] && [ $IM -ge 0 ]; then
              # 业务日 = 该 cron 计划时刻对应的北京时间日期
              BD=$(date -u -d "$(date -u +%F) $(printf '%02d:%02d' $((IM/60)) $((IM%60))) +8 hours" +%F)
              echo "bizdate=$BD" >> "$GITHUB_OUTPUT"
              # 超时丢弃：提醒晚到 >90 分钟已错过去入场窗口，推送只会造成混乱，直接放弃
              T=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
              DIFF=$(( (T - IM + 1440) % 1440 ))
              if [ $DIFF -gt 90 ]; then
                echo "stale=true" >> "$GITHUB_OUTPUT"
                echo "::warning::调度延迟 ${DIFF} 分钟（>90），本时段提醒放弃推送（时段=$S）"
              fi
              echo "cron=$C 时段=$S 业务日=$BD 延迟=${DIFF}分钟"
            else
              T=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
              if [ $T -ge 112 ] && [ $T -lt 472 ]; then S=noon; elif [ $T -ge 472 ] && [ $T -lt 1080 ]; then S=evening; else S=morning; fi
              echo "cron=$C 未识别，时间窗兜底时段=$S"
            fi
          fi
          echo "slot=$S" >> "$GITHUB_OUTPUT"

      - name: 推送入场信号到飞书
        if: steps.slot.outputs.stale != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TODAY_OVERRIDE: ${{ steps.slot.outputs.bizdate }}
        run: node monitor.mjs remind ${{ steps.slot.outputs.slot }}

      - name: 提交状态
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "remind ${{ steps.slot.outputs.slot }} $(date -u +'%F %T')"
          git push
