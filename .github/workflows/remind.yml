name: 信号提醒推送

# 北京时间 11:45 / 20:00 / 次日08:00 = UTC 03:45 / 12:00 / 00:00
# （较原 12:00/20:30/08:30 提前，抵消 GitHub 定时任务延迟；
#   引擎内含防竞态等待：若扫描尚未完成会先轮询等待，不会漏推信号）
# 精简网格（2026-10-30）：cron-job.org 外部定时已接管主调度，GitHub 侧 cron 降为备份层：
# 每时段保留主档 + 一档兜底（12 档 → 6 档）。理由同 scan.yml：减少仓库被降权导致整窗丢弃
# 的概率，并避免积压任务被延迟数小时倾倒造成的重复推送噪音。
# 时段由 github.event.schedule（触发本次的 cron）精确映射，延迟漂移不会错位；
# monitor.mjs 内 state.last_remind 幂等守卫保证同一时段只推一次，不会重复发信号卡；
# 晚到超过 90 分钟的提醒直接放弃推送（已过入场窗口，推送只会造成混乱）。
on:
  schedule:
    # 早间（北京 08:00 起，推前一交易日夜盘时段信号）
    - cron: '0 0 * * 1-5'     # 08:00 主档
    - cron: '10 0 * * 1-5'    # 08:10 兜底
    # 午间（北京 11:45 起，推 11:31 时段信号）
    - cron: '45 3 * * 1-5'    # 11:45 主档
    - cron: '55 3 * * 1-5'    # 11:55 兜底
    # 晚间（北京 20:00 起，推 15:01 时段信号，赶夜盘开盘）
    - cron: '0 12 * * 1-5'    # 20:00 主档
    - cron: '15 12 * * 1-5'   # 20:15 兜底
  workflow_dispatch:
    inputs:
      slot:
        description: '提醒时段 noon/evening/morning'
        required: true
        default: 'noon'
        type: choice
        options: [noon, evening, morning]
      force:
        description: '强制重推：1=忽略幂等守卫（UI 手动补推用）；0=参与去重（外部定时踢腿器必须用 0）'
        required: false
        default: '1'
        type: choice
        options: ['1', '0']

concurrency: qls-remind
permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确定提醒时段（cron 精确映射 + 超时丢弃；2026-10-29）
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.slot }}"
          else
            # github.event.schedule = 触发本次运行的 cron 表达式，直接映射时段
            C="${{ github.event.schedule }}"
            IM=-1
            case "$C" in
              "45 3 * * *")  S=noon;    IM=225 ;;
              "55 3 * * *")  S=noon;    IM=235 ;;
              "0 12 * * *")  S=evening; IM=720 ;;
              "15 12 * * *") S=evening; IM=735 ;;
              "0 0 * * *")   S=morning; IM=0 ;;
              "10 0 * * *")  S=morning; IM=10 ;;
            esac
            if [ -n "$S" ] && [ $IM -ge 0 ]; then
              # 业务日 = 该 cron 计划时刻对应的北京时间日期
              BD=$(date -u -d "$(date -u +%F) $(printf '%02d:%02d' $((IM/60)) $((IM%60))) +8 hours" +%F)
              echo "bizdate=$BD" >> "$GITHUB_OUTPUT"
              # 超时丢弃：提醒晚到 >90 分钟已错过入场窗口，推送只会造成混乱，直接放弃
              T=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
              DIFF=$(( (T - IM + 1440) % 1440 ))
              if [ $DIFF -gt 90 ]; then
                echo "stale=true" >> "$GITHUB_OUTPUT"
                echo "::warning::调度延迟 ${DIFF} 分钟（>90），本时段提醒放弃推送（时段=$S）"
              fi
              echo "cron=$C 时段=$S 业务日=$BD 延迟=${DIFF}分钟"
            else
              T=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
              if [ $T -ge 112 ] && [ $T -lt 472 ]; then S=noon; elif [ $T -ge 472 ] && [ $T -lt 1080 ]; then S=evening; else S=morning; fi
              echo "cron=$C 未识别，时间窗兜底时段=$S"
            fi
          fi
          echo "slot=$S" >> "$GITHUB_OUTPUT"

      - name: 推送入场信号到飞书
        if: steps.slot.outputs.stale != 'true'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TODAY_OVERRIDE: ${{ steps.slot.outputs.bizdate }}
          DISPATCH_FORCE: ${{ github.event.inputs.force }}
        run: node monitor.mjs remind ${{ steps.slot.outputs.slot }}

      - name: 提交状态
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "remind ${{ steps.slot.outputs.slot }} $(date -u +'%F %T')"
          git push
