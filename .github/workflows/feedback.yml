name: 交易反馈处理

# 在置顶 Issue 中评论指令即触发：成交 / 未成交 / 平仓
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  feedback:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析反馈并记账
        id: fb
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: node monitor.mjs feedback | tee feedback.log

      - name: 给评论打勾回应
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q PROCESSED feedback.log; then
            gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
              -f content=+1 --silent || true
          fi

      - name: 提交账本与面板
        run: |
          rm -f feedback.log
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "feedback $(date -u +'%F %T')"
          git push
