name: 收盘日报

# 北京时间 15:15 = UTC 07:15（日盘收盘后，当日日线已发布，按收盘价更新面板推飞书）
# 冗余三档（2026-10-28）：GitHub 定时任务可能在整段窗口被静默丢弃且不补跑，
# 故设 15:15 / 15:35 / 15:55 三档；monitor.mjs 内 state.last_daily 幂等守卫保证只实跑一次，
# 后两档若前档已完成则直接跳过（不重复推飞书、不重复写净值）。手动补跑用 Run workflow。
on:
  schedule:
    - cron: '15 7 * * *'
    - cron: '35 7 * * *'
    - cron: '55 7 * * *'
  workflow_dispatch:

concurrency: qls-daily
permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 推送收盘日报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: node monitor.mjs daily

      - name: 提交数据与面板
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily $(date -u +'%F %T')"
          git push
