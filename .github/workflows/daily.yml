name: 收盘日报

# 北京时间 15:15 = UTC 07:15（日盘收盘后，当日日线已发布，按收盘价更新面板推飞书）
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency: qls-daily
permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 推送收盘日报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: node monitor.mjs daily

      - name: 提交数据与面板
        run: |
          git config user.name "qls-bot"
          git config user.email "qls-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "daily $(date -u +'%F %T')"
          git push
